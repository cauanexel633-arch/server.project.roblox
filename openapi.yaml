openapi: 3.1.0
info:
  title: Forge3D Cloud API
  version: 0.1.0
  description: Initial API contract; generation endpoints will be added in later phases.
servers:
  - url: https://{deployment}.vercel.app
    variables:
      deployment:
        default: forge3d-cloud-v2
paths:
  /health:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: Service is alive
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: Configuration is ready
